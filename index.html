
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Enhle ❤️</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #5b03f4;
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    width: 90%;
    max-width: 460px;
    min-height: 300px;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 8px 30px #0408f4;
}

.bear { font-size: 65px; }

h2 {
    font-size: 21px;
    color: #222;
    line-height: 1.5;
}

.buttons {
    position: relative;
    height: 145px;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: absolute;
    transition: all 0.25s ease;
}

#yesBtn {
    background: #3306fc;
    color: white;
    padding: 12px 25px;
    font-size: 16px;
    left: 25%;
    top: 20px;
    transform-origin: center;
}

#noBtn {
    background: #eeeeee;
    color: #444;
    padding: 10px 20px;
    font-size: 14px;
    left: 65%;
    top: 25px;
}

#success { display: none; }

#success h1 {
    font-size: 28px;
    color: #222;
}

#success img {
    width: 220px;
    max-width: 100%;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="card">

    <div id="question">
        <div class="bear">🐻💕</div>

        <h2>
            Enhle, will you please make me
            the happiest man in the world
            and be my girlfriend? ❤️
        </h2>

        <div class="buttons" id="buttonArea">
            <button id="yesBtn" onclick="sayYes()">
                Yes
            </button>

            <button id="noBtn"
                onmouseover="moveNo()"
                onclick="moveNo()">
                No
            </button>
        </div>
    </div>

    <div id="success">
        <div class="bear">🐻💕</div>
        <h2>Enhle, will you please make me
        the happiest man in the world
        and be my girlfriend? ❤️</h2>

        <h1>YAY! 🎉</h1>

        
<img src="images/kai.jpeg" alt="Enhle Proposal Image">


        <p>You just made me the happiest man alive! ❤️</p>
    </div>

</div>

<script>
let count = 0;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const area = document.getElementById("buttonArea");

function moveNo() {
    count++;

    // Yes gets bigger each time
    const scale = Math.min(1 + count * 0.3, 3);
    yesBtn.style.transform = `scale(${scale})`;

    // No jumps around the button area
    const maxX = area.clientWidth - noBtn.offsetWidth;
    const maxY = area.clientHeight - noBtn.offsetHeight;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

function sayYes() {
    document.getElementById("question").style.display = "none";
    document.getElementById("success").style.display = "block";
}
</script>

</body>
</html>
